<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>벼락노트 · 퀴즈</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body data-page="quiz">
  <div id="cn-nav"></div>

  <main class="container py-4 py-lg-5">
    <nav class="breadcrumb-lite" aria-label="위치">
      <a href="index.html">내 과목</a> <i class="bi bi-chevron-right"></i>
      <a id="crumbSubject"></a> <i class="bi bi-chevron-right"></i>
      <span id="crumbCurrent">퀴즈</span>
    </nav>

    <!-- 1. 설정 -->
    <section id="setupView" class="d-none">
      <header class="page-head">
        <div>
          <h1>퀴즈 만들기</h1>
          <p>출제 범위와 문제 구성을 고르면 강의자료로 문제를 만들어 드려요.</p>
        </div>
      </header>
      <div class="row g-5">
        <div class="col-lg-7">
          <div class="setup-head">
            <h2 class="section-title mb-0">출제 범위</h2>
            <button type="button" class="btn btn-sm btn-light" id="selectAllBtn">전체 선택</button>
          </div>
          <div id="materialChecks" class="material-checks"></div>
        </div>
        <div class="col-lg-5">
          <h2 class="section-title">문제 구성</h2>
          <div id="countRows" class="count-rows"></div>
          <div class="total-line">모두 <strong id="totalCount">0</strong>문항</div>

          <span class="form-label d-block mt-4">난이도</span>
          <div class="btn-group w-100 mb-4" role="group" aria-label="난이도">
            <input type="radio" class="btn-check" name="difficulty" id="dEasy" value="easy">
            <label class="btn btn-outline-secondary" for="dEasy">기본 개념</label>
            <input type="radio" class="btn-check" name="difficulty" id="dNormal" value="normal" checked>
            <label class="btn btn-outline-secondary" for="dNormal">보통</label>
            <input type="radio" class="btn-check" name="difficulty" id="dHard" value="hard">
            <label class="btn btn-outline-secondary" for="dHard">심화</label>
          </div>

          <button type="button" class="btn btn-primary btn-lg w-100" id="generateBtn">문제 만들기</button>
          <p class="small text-muted mt-2 mb-0">문항 수에 따라 30초에서 1분 정도 걸려요.</p>
        </div>
      </div>
    </section>

    <!-- 2. 생성 중 -->
    <section id="loadingView" class="d-none">
      <div class="loading-sheet">
        <div class="loading-line" aria-hidden="true"><span></span></div>
        <h2 id="loadingTitle">문제를 만들고 있어요</h2>
        <p class="text-muted" id="loadingText">강의자료를 읽고 출제하는 중이에요.</p>
        <p class="small text-muted" id="loadingTimer">0초</p>
        <button type="button" class="btn btn-light" id="cancelBtn">취소</button>
      </div>
    </section>

    <!-- 3. 풀기: 시험지 + OMR 답안지 -->
    <section id="solveView" class="d-none">
      <header class="exam-head">
        <p class="exam-kicker" id="solveSubject"></p>
        <h1 class="exam-title" id="solveTitle"></h1>
      </header>
      <div class="row g-5">
        <div class="col-lg-8">
          <div id="questionList" class="exam-paper"></div>
        </div>
        <aside class="col-lg-4">
          <div class="omr-wrap">
            <div class="omr" id="omrCard" aria-label="답안지"></div>
            <div class="omr-progress">
              <div class="progress" style="height:3px"><div class="progress-bar" id="solveProgress"></div></div>
              <span id="solveCount"></span>
            </div>
            <button type="button" class="btn btn-primary btn-lg w-100" id="submitBtn">답안 제출</button>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer id="cn-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/common.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
