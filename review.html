<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>벼락노트 · 오답노트</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/review.css">
</head>
<body data-page="review">
  <div id="cn-nav"></div>

  <main class="container py-4 py-lg-5">
    <header class="page-head">
      <div>
        <h1>오답노트</h1>
        <p>퀴즈에서 틀린 문제가 자동으로 모여요. 다시 풀어서 맞히면 '해결됨'으로 옮겨져요.</p>
      </div>
      <a class="btn btn-primary" id="retryBtn">오답 다시 풀기</a>
    </header>

    <section class="filter-bar mb-4">
      <div class="filter-group">
        <label for="subjectFilter" class="form-label mb-1">과목</label>
        <select class="form-select" id="subjectFilter"></select>
      </div>
      <div class="filter-group">
        <span class="form-label d-block mb-1">상태</span>
        <div class="btn-group" role="group" aria-label="상태">
          <input type="radio" class="btn-check" name="statusFilter" id="sOpen" value="open" checked>
          <label class="btn btn-outline-secondary" for="sOpen">미해결 <span data-count="open"></span></label>
          <input type="radio" class="btn-check" name="statusFilter" id="sDone" value="done">
          <label class="btn btn-outline-secondary" for="sDone">해결됨 <span data-count="done"></span></label>
          <input type="radio" class="btn-check" name="statusFilter" id="sAll" value="all">
          <label class="btn btn-outline-secondary" for="sAll">전체</label>
        </div>
      </div>
      <div class="filter-group">
        <label for="typeFilter" class="form-label mb-1">유형</label>
        <select class="form-select" id="typeFilter">
          <option value="all">전체 유형</option>
          <option value="mc">객관식</option>
          <option value="tf">OX</option>
          <option value="short">주관식</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="sortFilter" class="form-label mb-1">정렬</label>
        <select class="form-select" id="sortFilter">
          <option value="recent">최근 틀린 순</option>
          <option value="count">많이 틀린 순</option>
        </select>
      </div>
    </section>

    <div id="wrongList"></div>
  </main>

  <footer id="cn-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/common.js"></script>
  <script src="js/review.js"></script>
</body>
</html>
