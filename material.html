<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>벼락노트 · 자료 올리기</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/material.css">
</head>
<body data-page="material">
  <div id="cn-nav"></div>

  <main class="container py-4 py-lg-5">
    <nav class="breadcrumb-lite" aria-label="위치">
      <a href="index.html">내 과목</a> <i class="bi bi-chevron-right"></i>
      <a id="crumbSubject"></a> <i class="bi bi-chevron-right"></i>
      <span id="crumbCurrent"></span>
    </nav>

    <!-- ================= 올리기 모드 ================= -->
    <section id="uploadView" class="d-none">
      <header class="page-head">
        <div>
          <h1>강의자료 올리기</h1>
          <p>강의자료를 올리면 텍스트를 뽑아서 요약 노트를 만들어 드려요.</p>
        </div>
      </header>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="cn-card mb-3">
            <ul class="nav nav-tabs mb-3" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#srcFile" type="button" role="tab" data-src="file">파일 올리기</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#srcPaste" type="button" role="tab" data-src="paste">텍스트 붙여넣기</button>
              </li>
            </ul>
            <div class="tab-content">
              <div class="tab-pane fade show active" id="srcFile" role="tabpanel">
                <label class="drop-zone" id="dropZone" for="fileInput">
                  <strong>파일을 끌어다 놓거나 클릭해서 선택</strong>
                  <span>PDF · PPTX · DOCX · TXT (최대 30MB)</span>
                  <input type="file" id="fileInput" accept=".pdf,.pptx,.docx,.txt,.md" hidden>
                </label>
                <div id="parsedInfo"></div>
              </div>
              <div class="tab-pane fade" id="srcPaste" role="tabpanel">
                <textarea class="form-control paste-area" id="pasteText" rows="11"
                          placeholder="강의 노트, 교재 내용 등을 붙여넣으세요."></textarea>
                <p class="small text-muted mt-2 mb-0" id="pasteCount">0자</p>
              </div>
            </div>
          </div>

          <div class="cn-card">
            <label for="titleInput" class="form-label">자료 제목</label>
            <input type="text" class="form-control mb-3" id="titleInput" maxlength="80" placeholder="예) 5주차 프로세스 스케줄링">
            <div class="d-grid gap-2">
              <button type="button" class="btn btn-primary btn-lg" id="summarizeBtn" disabled>
                요약 만들고 저장
              </button>
              <button type="button" class="btn btn-light" id="saveOnlyBtn" disabled>요약 없이 저장</button>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="stream-card">
            <div class="cn-card-head">
              <h2>요약 노트 미리보기</h2>
              <button type="button" class="btn btn-sm btn-outline-danger d-none" id="stopBtn"><i class="bi bi-stop-fill"></i> 중지</button>
            </div>
            <div id="streamStatus" class="stream-status d-none"></div>
            <div id="streamBox" class="md-body">
              <div class="stream-placeholder">
                <p>요약이 만들어지는 대로 여기에 표시돼요.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="cn-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/common.js"></script>
  <script src="js/material.js"></script>
</body>
</html>
