<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>벼락노트 · 내 과목</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body data-page="home">
  <div id="cn-nav"></div>

  <main class="container py-4 py-lg-5">
    <header class="page-head">
      <div>
        <h1>내 과목</h1>
        <p>과목별로 강의자료를 모아 두고 요약 노트와 퀴즈로 복습해요.</p>
      </div>
      <button type="button" class="btn btn-primary" id="newSubjectBtn"><i class="bi bi-plus-lg"></i> 새 과목</button>
    </header>

    <section class="mb-5" aria-label="과목 목록">
      <div class="row g-4 folder-grid" id="subjectGrid"></div>
    </section>

    <section aria-labelledby="recentTitle">
      <h2 class="section-title" id="recentTitle">최근 올린 자료</h2>
      <ul class="recent-list" id="recentMaterials"></ul>
    </section>
  </main>

  <!-- 과목 추가/수정 모달 -->
  <div class="modal fade" id="subjectModal" tabindex="-1" aria-labelledby="subjectModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="subjectForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="subjectModalTitle">새 과목</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="subjectId">
          <label for="subjectName" class="form-label">과목 이름</label>
          <input type="text" class="form-control mb-3" id="subjectName" maxlength="30" placeholder="예) 운영체제" required>
          <div class="invalid-feedback">과목 이름을 입력해 주세요.</div>
          <span class="form-label d-block">폴더 색</span>
          <div class="color-picker" id="colorPicker" role="radiogroup" aria-label="폴더 색"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">취소</button>
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <footer id="cn-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/common.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
