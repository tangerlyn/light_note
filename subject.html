<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>벼락노트 · 과목</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/subject.css">
</head>
<body data-page="subject">
  <div id="cn-nav"></div>

  <main class="container py-4 py-lg-5">
    <nav class="breadcrumb-lite" aria-label="위치">
      <a href="index.html">내 과목</a> <i class="bi bi-chevron-right"></i> <span id="crumbName"></span>
    </nav>

    <header class="page-head">
      <div>
        <h1 id="subjectTitle"></h1>
        <p id="subjectMeta"></p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-light" id="reviewLink">오답노트</a>
        <a class="btn btn-outline-primary" id="quizLink">퀴즈 만들기</a>
        <a class="btn btn-primary" id="uploadLink"><i class="bi bi-plus-lg"></i> 자료 올리기</a>
      </div>
    </header>

    <ul class="nav nav-tabs mb-4" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabMaterials" type="button" role="tab">
          강의자료 <span class="tab-count" id="countMaterials"></span>
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabAttempts" type="button" role="tab">
          퀴즈 기록 <span class="tab-count" id="countAttempts"></span>
        </button>
      </li>
    </ul>

    <div class="tab-content">
      <section class="tab-pane fade show active" id="tabMaterials" role="tabpanel">
        <ul class="material-list" id="materialList"></ul>
      </section>
      <section class="tab-pane fade" id="tabAttempts" role="tabpanel">
        <div>
          <div class="table-responsive">
            <table class="table attempt-table align-middle mb-0">
              <thead>
                <tr><th>날짜</th><th>범위</th><th>문항</th><th>점수</th><th></th></tr>
              </thead>
              <tbody id="attemptBody"></tbody>
            </table>
          </div>
          <div class="empty-state d-none" id="attemptEmpty">
            <i class="bi bi-ui-checks empty-icon"></i>
            <h3>아직 푼 퀴즈가 없어요</h3>
            <p class="small mb-0">자료를 올리고 퀴즈를 만들어 보세요.</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer id="cn-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/common.js"></script>
  <script src="js/subject.js"></script>
</body>
</html>
