<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>벼락노트 · 시험 일정</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/schedule.css">
</head>
<body data-page="schedule">
  <div id="cn-nav"></div>

  <main class="container py-4 py-lg-5">
    <header class="page-head">
      <div>
        <h1>시험 일정</h1>
        <p>시험 날짜를 넣으면 남은 날짜에 맞춰 복습 계획을 짜 드려요.</p>
      </div>
      <button type="button" class="btn btn-primary" id="addExamBtn"><i class="bi bi-plus-lg"></i> 시험 추가</button>
    </header>

    <!-- 다가오는 시험: 수험표 -->
    <section class="mb-5" aria-labelledby="ticketsTitle">
      <h2 class="section-title" id="ticketsTitle">다가오는 시험</h2>
      <div class="row g-4" id="ticketList"></div>
    </section>

    <div class="row g-5">
      <!-- 복습 계획 -->
      <section class="col-lg-7" aria-labelledby="planTitle">
        <div class="plan-head">
          <h2 class="section-title mb-0" id="planTitle">복습 계획</h2>
          <select class="form-select form-select-sm w-auto" id="planExamSelect" aria-label="계획을 볼 시험"></select>
        </div>
        <div id="planBody"></div>
      </section>

      <!-- 달력 -->
      <section class="col-lg-5" aria-labelledby="calTitle">
        <div class="cal-head">
          <h2 class="section-title mb-0" id="calTitle"></h2>
          <div class="d-flex gap-1">
            <button type="button" class="btn btn-icon" id="calPrev" aria-label="이전 달"><i class="bi bi-chevron-left"></i></button>
            <button type="button" class="btn btn-icon" id="calNext" aria-label="다음 달"><i class="bi bi-chevron-right"></i></button>
          </div>
        </div>
        <div class="calendar" id="calendar"></div>

        <details class="past-exams" id="pastWrap">
          <summary>지난 시험 <span id="pastCount"></span></summary>
          <ul id="pastList"></ul>
        </details>
      </section>
    </div>
  </main>

  <!-- 시험 추가/수정 -->
  <div class="modal fade" id="examModal" tabindex="-1" aria-labelledby="examModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <form class="modal-content" id="examForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="examModalTitle">시험 추가</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="examId">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="examSubject" class="form-label">과목</label>
              <select class="form-select" id="examSubject" required></select>
            </div>
            <div class="col-md-6">
              <label for="examName" class="form-label">시험 이름</label>
              <input type="text" class="form-control" id="examName" maxlength="30" placeholder="예) 중간고사" required>
              <div class="name-chips">
                <button type="button" data-name="중간고사">중간고사</button>
                <button type="button" data-name="기말고사">기말고사</button>
                <button type="button" data-name="쪽지시험">쪽지시험</button>
                <button type="button" data-name="퀴즈">퀴즈</button>
              </div>
            </div>
            <div class="col-md-4">
              <label for="examDate" class="form-label">날짜</label>
              <input type="date" class="form-control" id="examDate" required>
              <div class="invalid-feedback">날짜를 골라 주세요.</div>
            </div>
            <div class="col-md-4">
              <label for="examTime" class="form-label">시간 (선택)</label>
              <input type="time" class="form-control" id="examTime">
            </div>
            <div class="col-md-4">
              <label for="examPlace" class="form-label">장소 (선택)</label>
              <input type="text" class="form-control" id="examPlace" maxlength="30" placeholder="예) 정보과학관 21304">
            </div>
            <div class="col-12">
              <span class="form-label d-block">시험 범위 <small class="text-muted fw-normal">체크한 자료로 복습 계획을 만들어요</small></span>
              <div id="examScope" class="scope-list"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">취소</button>
          <button type="submit" class="btn btn-primary">저장</button>
        </div>
      </form>
    </div>
  </div>

  <footer id="cn-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/common.js"></script>
  <script src="js/schedule.js"></script>
</body>
</html>
